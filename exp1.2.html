<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Interface</title>
    <style>
        body {
            padding: 25px;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            border-radius: 8px;
            padding: 20px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .title {
            color: #5C6AC4;
            text-align: center;
            margin-bottom: 15px;
        }

        .balance-container {
            display: flex;
            justify-content: space-between;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input#amount {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 4px;
            transition: border-color 0.3s;
        }

        input#amount:focus {
            outline: none;
            border-color: #5C6AC4;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 0;
            font-size: 1em;
            border: none;
            border-radius: 4px;
            color: white;
            background-color: #5C6AC4;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #4a54a1;
        }

        #message {
            color: red;
            font-weight: 600;
            min-height: 1.2em;
            text-align: center;
            font-size: 0.9em;
        }

        /* Responsive layout */
        @media (max-width: 400px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">Bank UI</h1>
        
        <div class="balance-container">
            <span>Balance:</span>
            <span id="balance">₹0.00</span>
        </div>

        <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01" />

        <div class="buttons">
            <button id="depositBtn">Deposit</button>
            <button id="withdrawBtn">Withdraw</button>
        </div>

        <p id="message"></p>
    </div>

    <script>
        let balance = 0;

        const balanceEl = document.getElementById('balance');
        const amountInput = document.getElementById('amount');
        const messageEl = document.getElementById('message');

        function updateBalance() {
            balanceEl.textContent = `₹${balance.toFixed(2)}`;
        }

        function showMessage(msg, error = true) {
            messageEl.textContent = msg;
            messageEl.style.color = error ? '#e74c3c' : '#27ae60';
        }

        document.getElementById('depositBtn').addEventListener('click', () => {
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                showMessage('Please enter a valid amount to deposit.');
                return;
            }
            balance += amount;
            updateBalance();
            showMessage(`Deposited ₹${amount.toFixed(2)} successfully`, false);
            amountInput.value = '';
        });

        document.getElementById('withdrawBtn').addEventListener('click', () => {
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                showMessage('Please enter a valid amount to withdraw.');
                return;
            }
            if (amount > balance) {
                showMessage('Insufficient balance.');
                return;
            }
            balance -= amount;
            updateBalance();
            showMessage(`Withdrew ₹${amount.toFixed(2)} successfully`, false);
            amountInput.value = '';
        });

        // Initialize display
        updateBalance();
    </script>
</body>
</html>
